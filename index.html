<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rosie's Recipes</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
:root{--bg:#fbf7f2;--card:#fff;--text:#2a2019;--muted:#7d6f63;--accent:#c4552d;--chip:#f1e8de;--line:#e8dccf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1512;--card:#261e19;--text:#f4ebe2;--muted:#b5a597;--accent:#f0805a;--chip:#372b23;--line:#493a30}}
:root[data-theme="dark"]{--bg:#1a1512;--card:#261e19;--text:#f4ebe2;--muted:#b5a597;--accent:#f0805a;--chip:#372b23;--line:#493a30}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,sans-serif}
main{max-width:720px;margin:0 auto;padding:22px 16px 56px}
h1,h2{font-family:Georgia,'Times New Roman',serif;margin:0}
h1{font-size:30px}
.sub{color:var(--muted);margin:2px 0 18px;font-size:14px}
input[type=search]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--text);padding:7px 14px;border-radius:999px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card .e{font-size:38px}
.card h2{font-size:18px;margin:6px 0 2px}
.meta{color:var(--muted);font-size:13px}
.back{display:inline-block;margin-bottom:14px;color:var(--accent);text-decoration:none;font-size:15px}
.hero{font-size:56px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0}
.scale{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.scale button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--text);font-size:20px;cursor:pointer}
ul{list-style:none;padding:0;margin:0}
li.i{padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
li.i:last-child{border:0}
li.i.done{opacity:.4;text-decoration:line-through}
li.i b{color:var(--accent)}
ol{padding-left:22px;margin:0}
ol li{margin-bottom:12px}
.note{color:var(--muted);font-size:14px;font-style:italic}
.empty{color:var(--muted);text-align:center;padding:30px 0}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ============ EDIT YOUR RECIPES HERE ============
   ing: [amount, unit, name]  (leave unit '' for things like eggs)
   Copy a recipe block, change the details, keep the commas. */
const RECIPES=[
{id:'banana-chocolate-cake',title:'Banana and Chocolate Cake',emoji:'🍌',cat:'Baking',time:'1 hr',serves:8,
 ing:[[170,'g','margarine'],[230,'g','granulated sugar'],[2,'','large ripe bananas (about 225g peeled)'],[0.5,'tsp','vanilla essence'],[280,'g','self-raising flour'],[0.5,'tsp','level salt'],[0.5,'tsp','level bicarbonate of soda'],[3,'','eggs'],[60,'g','chocolate chips'],[1,'tbsp','plain flour, rounded (topping)'],[1,'tbsp','Demerara sugar, rounded (topping)'],[1,'knob','butter (topping)']],
 steps:['Heat the oven to 160°C (325°F / gas 3). Grease a round 8in tin and line the base and sides with greaseproof paper.','Gently melt the margarine and sugar in a saucepan over a low heat, then take off the heat.','Mash the bananas with the vanilla until smooth.','Sift the flour, salt and bicarbonate into the pan and mix. Add the beaten eggs and banana and mix well.','Stir in the chocolate chips without over-mixing.','Spoon into the tin and level the top.','Rub the topping flour, Demerara and butter together to fine crumbs and sprinkle over.','Bake in the centre of the oven for 40 minutes.'],note:'Use brown-skinned ripe bananas.'},

{id:'porridgies',title:'Porridgies',emoji:'🥣',cat:'Baking',time:'45 min',serves:12,
 ing:[[100,'g','butter'],[75,'g','soft brown sugar'],[2,'tbsp','golden syrup (30ml)'],[200,'g','rolled oats'],[1,'pinch','salt']],
 steps:['Heat the oven to 120°C. Grease a 20 x 30cm shallow baking tray.','Melt the butter in a large pan over a low heat.','Add the sugar, syrup and salt and mix well.','Stir in the rolled oats and mix very well.','Spread evenly in the tray with a palette knife.','Bake for 25-35 minutes, until golden brown.','Let cool a little, then mark into squares or fingers with a knife.','Leave in the tray until cold, then store in an airtight tin.'],note:'Best eaten while still warm.'},


{id:'pomegranate-walnut-herb-rice-salad',title:'Pomegranate, Walnut & Herb Rice Salad',emoji:'🥗',cat:'Lunch',time:'35 min + cooling',serves:4,
 ing:[[250,'g','basmati or long-grain rice (uncooked)'],[2,'handfuls','rocket'],[1,'','pomegranate, seeds removed'],[1,'small head','broccoli, cut into small florets'],[1,'','roasted red pepper, sliced'],[1,'handful','fresh parsley, chopped'],[1,'handful','fresh mint leaves, chopped'],[1,'handful','fresh coriander, chopped'],[50,'g','walnuts'],[4,'tbsp','extra-virgin olive oil'],[2,'tbsp','white wine vinegar'],[1,'','garlic clove'],[1.5,'tbsp','pomegranate molasses'],[0.5,'tsp','salt'],[2,'tbsp','water, if needed']],
 steps:['Rinse the rice under cold water until the water runs mostly clear. Cook according to the packet instructions, then drain if necessary.','Spread the cooked rice on a large plate or tray and leave to cool completely.','Steam or boil the broccoli florets for 2–3 minutes until just tender but still slightly crunchy. Drain and rinse under cold water to stop them cooking.','Add the walnuts, olive oil, white wine vinegar, garlic, pomegranate molasses and salt to a blender or food processor. Blitz until you have a thick, slightly textured dressing.','Add 1–2 tablespoons of water and blitz again if the dressing is too thick.','Finely chop the parsley, mint leaves and coriander. Remove the pomegranate seeds and slice the roasted red pepper.','Put the cooled rice into a large salad bowl. Add the rocket, broccoli, roasted red pepper, pomegranate seeds and chopped herbs.','Pour over most of the walnut dressing and toss gently until everything is coated. Add more dressing to taste.','Taste and adjust the seasoning with extra salt, white wine vinegar or pomegranate molasses as needed.','Finish with a scattering of extra pomegranate seeds, herbs and chopped walnuts, if available. Serve chilled or at room temperature.'],
 note:'Let the rice cool before adding the rocket and fresh herbs so they stay fresh and vibrant. Tender mint stems can be used, but remove any thick or woody stems. Optional extra vegetables include cucumber, spring onions, cherry tomatoes, roasted courgette or carrots. Cool cooked rice quickly and refrigerate promptly if not serving immediately.'},

{id:'thai-basil-coconut-tofu',title:'Thai Basil Coconut Tofu',emoji:'🥥',cat:'Dinner',time:'45 min',serves:4,
 ing:[[450,'g','extra-firm tofu'],[4,'tbsp','rapeseed oil (3 tbsp for tofu, about 1 tbsp extra for vegetables)'],[300,'g','green beans, topped and tailed'],[1,'','onion, peeled and finely sliced'],[5,'cm','fresh ginger (about 4cm piece), peeled and grated'],[2,'','red bird’s-eye chillies, finely sliced'],[1.5,'tsp','caster sugar'],[0.5,'tsp','ground turmeric'],[1.5,'tsp','fine sea salt, or to taste'],[400,'ml','coconut milk (1 tin)'],[1.5,'tbsp','fresh lime juice (about 1 lime)'],[25,'g','Thai basil leaves'],[1,'','portion jasmine rice, per person, to serve']],
 steps:['Prepare the tofu by holding it over the sink and gently pressing the block between your hands to remove as much water as possible. Wrap in kitchen paper, press again, then unwrap and cut into 2.5cm cubes.','Place a large plate beside the stove for the cooked tofu and beans. Have tongs or two forks ready to turn the tofu.','Heat 3 tablespoons of rapeseed oil in a large frying pan over a medium-high heat. When very hot, add the tofu and fry for 6–8 minutes, turning every minute or two, until golden brown all over. Transfer to the plate, leaving the pan on the heat.','Add the green beans to the hot pan. Shake the pan to arrange them in a single layer and leave to blister for 2 minutes. Turn the beans and cook for another 2 minutes, until flecked with brown. Transfer to the plate with the tofu.','Return the pan to the heat and add about 1 tablespoon more rapeseed oil. Once hot, add the sliced onion and fry, stirring, for about 6 minutes until translucent and beginning to catch at the edges.','Add the grated ginger and sliced chillies. Stir-fry for 2 minutes.','Stir in the caster sugar, turmeric and salt. Add the coconut milk, cooked tofu, green beans and lime juice. Bring to a simmer, then cook gently for 5 minutes.','Stir in the Thai basil leaves and cook for a final minute, until wilted. Stir again and taste, adjusting the lime juice and salt if needed.','Serve in bowls over freshly steamed jasmine rice.'],
 note:'Prep 15 minutes; cook 30 minutes. Adjust the chilli to taste. Use extra lime juice or salt at the end to balance the coconut milk.'},

   
{id:'avocado-pesto-pasta',title:'Avocado Pesto Pasta',emoji:'🥑',cat:'Dinner',time:'20 min',serves:4,
 ing:[[225,'g','pasta of choice'],[1,'large','v ripe avocado'],[85,'g','fresh basil, leaves only'],[0.5,'bunch','fresh parsley, leaves only'],[4,'','garlic cloves'],[0.25,'cup','nutritional yeast'],[1,'','lemon, zest and juice'],[0.5,'tsp','red chilli flakes (optional)'],[60,'ml','vegetable broth, plus more as needed'],[0.5,'tsp','salt, plus more to taste']],
 steps:['Bring a large pot of salted water to the boil. Add the pasta and cook according to the packet instructions until al dente.','While the pasta cooks, add the avocado, basil leaves, parsley leaves, garlic, nutritional yeast, lemon zest and juice, chilli flakes (if using), vegetable broth and salt to a food processor.','Blend until the pesto is smooth and evenly combined. If you prefer a thinner sauce, add extra vegetable broth 2 tablespoons at a time, blending after each addition.','Before draining the pasta, reserve a little pasta water if desired. Drain the pasta and return it to the pot.','Reduce the heat to low and add the avocado pesto. Toss until the pasta is evenly coated and the sauce is gently warmed. Avoid overheating the sauce.','Taste and adjust the salt, lemon juice or consistency as needed. Add a splash of reserved pasta water or vegetable broth if the sauce is too thick.','Serve immediately, with extra nutritional yeast, fresh basil or chilli flakes if desired.'],
 note:'Prep 10 minutes; cook 10 minutes. Makes 2–4 servings. Store leftover pesto in an airtight container in the fridge for up to one week or freeze for up to one month. The avocado may darken slightly over time.'},

   
{id:'gooey-chocolate-slice',title:'Gooey Chocolate Slice',emoji:'🍫',cat:'Baking',time:'20 min bake + cooling',serves:12,
 ing:[[100,'g','dark chocolate, broken into pieces'],[100,'g','coconut oil'],[3,'','medium organic eggs, separated'],[125,'g','ground almonds'],[100,'g','caster sugar'],[100,'g','dark chocolate chips']],
 steps:['Heat the oven to 160°C fan (180°C / gas 4). Grease a 20 x 15 x 7.5cm tin and line with non-stick baking parchment.','Put the chocolate and coconut oil in a bowl set over a pan of gently simmering water.','Remove the bowl from the heat and whisk in the egg yolks, followed by the almonds.','Whisk the egg whites to stiff peaks, then whisk in the sugar to make a meringue.','Gently fold one-quarter of the meringue into the chocolate mixture until smooth.','Fold in the rest of the meringue and the chocolate chips until combined.','Transfer to the tin and bake for 20 minutes.','Leave to settle for 15-30 minutes, then lift out on the paper and slice.'],note: "Colloquially known as 'The Rosie Classic.'"},
{id:'red-lentil-curry',title:'Red Lentil Curry',emoji:'🍛',cat:'Dinner',time:'50 min',serves:5,
 ing:[[2,'','medium white onions, finely chopped'],[5,'','garlic cloves, minced'],[40,'g','fresh ginger, peeled and grated'],[3,'','carrots, sliced into thin moons'],[1,'','tin chopped tomatoes'],[1,'','tin coconut milk'],[1,'','bunch fresh coriander, stems finely chopped and leaves torn'],[1,'','lime (half juiced, wedges to serve)'],[200,'g','red lentils'],[5,'','mini naan breads'],[750,'ml','veggie stock'],[1,'tbsp','coconut oil'],[1,'tsp','cumin'],[1,'tbsp','curry powder'],[1,'tsp','turmeric'],[1,'pinch','salt'],[1,'pinch','chilli flakes (optional)'],[1,'dollop','yoghurt to serve (optional)']],
 steps:['Fry the onions in the coconut oil with a generous pinch of salt for 5-6 minutes, until translucent.','Add the garlic, ginger, coriander stalks, carrots and spices. Fry for 2 more minutes.','Add the stock, chopped tomatoes, coconut milk and lentils. Stir, then reduce the heat and simmer for about 30 minutes. Add salt to taste.','Stir in the juice of half the lime.','Serve each portion with a swirl of yoghurt, torn coriander and a squeeze of lime, with a naan on the side.'],note:'Olive oil works instead of coconut oil.'},
{id:'creamy-spiced-vegetable-ramen',title:'Creamy Spiced Vegetable Ramen',emoji:'🍜',cat:'Dinner',time:'40 min',serves:5,
 ing:[[250,'g','chestnut mushrooms, chopped'],[0.5,'jar','red Thai paste'],[1,'','tin coconut milk'],[225,'g','rice noodles'],[3,'','carrots, spiralised'],[160,'g','tenderstem broccoli'],[200,'g','beansprouts'],[1,'','lime (half juiced, wedges to serve)'],[1,'handful','coriander'],[1,'few','chillies, chopped'],[1,'tbsp','coconut oil'],[1.5,'l','vegetable stock']],
 steps:['Heat the oil in a large saucepan or wok on a high heat. Add the mushrooms and leave to brown.','Add the Thai paste and fry gently for about 1 minute.','Slowly stir in the coconut milk and vegetable stock, then reduce to a low simmer for 15 minutes.','Add the tenderstem broccoli and spiralised carrots and cook for the final 10 minutes.','Two minutes before the end, add the beansprouts, noodles and the juice of half the lime.','Serve garnished with a lime wedge, coriander and chopped chilli.'],note:'Olive oil works instead of coconut oil.'},
{id:'sesame-tahini-cookies',title:'Sesame Tahini Cookies',emoji:'🍪',cat:'Baking',time:'23 min',serves:9,
 ing:[[0.5,'cup','sesame seeds'],[1.5,'cups','almond flour'],[0.5,'tsp','baking soda'],[0.25,'tsp','sea salt'],[1/3,'cup','honey'],[1/3,'cup','tahini'],[1,'tsp','vanilla extract']],
 steps:['Heat the oven to 350°F (about 175°C) and line 2 baking sheets with parchment paper. Spread the sesame seeds in a pie plate.','Whisk the almond flour, baking soda and salt in a small bowl.','In a large bowl, mix the honey, tahini and vanilla. Add the dry ingredients and stir until well combined.','Scoop the dough into balls with a cookie scoop. Roll each ball in the sesame seeds, then flatten to rounds about 1/4 inch (6mm) thick.','Place the rounds about 2 inches (5cm) apart on the baking sheets.','Bake for about 8 minutes, until the bottoms are golden, swapping the pans top to bottom halfway through.','Move the cookies to a rack and let them cool before serving.'],note:''},
];
/* ================================================ */

const app=document.getElementById('app');
let q='',cat='All',serv=null,rid=null;
const cats=['All',...new Set(RECIPES.map(r=>r.cat))];
const fmt=n=>{n=Math.round(n*100)/100;return String(n)};

function list(){
 const f=RECIPES.filter(r=>(cat==='All'||r.cat===cat)&&(r.title+' '+r.ing.map(i=>i[2]).join(' ')).toLowerCase().includes(q.toLowerCase()));
 app.innerHTML=`<h1>Rosie's Recipes</h1><p class="sub">An attempt to have access to my go-to reciples using NFC tag</p>
 <input type="search" id="s" placeholder="Search recipes or ingredients" value="${q.replace(/"/g,'&quot;')}">
 <div class="chips">${cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('')}</div>
 <div class="grid">${f.map(r=>`<a class="card" href="#${r.id}"><div class="e">${r.emoji}</div><h2>${r.title}</h2><div class="meta">${r.cat} · ${r.time}</div></a>`).join('')||'<p class="empty">No recipes found.</p>'}</div>`;
 const s=document.getElementById('s');
 s.oninput=e=>{q=e.target.value;const p=s.selectionStart;list();const n=document.getElementById('s');n.focus();n.setSelectionRange(p,p)};
 app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;list()});
}

function detail(r){
 if(rid!==r.id){rid=r.id;serv=r.serves}
 const k=serv/r.serves;
 app.innerHTML=`<a class="back" href="#">← All recipes</a>
 <div class="hero">${r.emoji}</div><h1>${r.title}</h1><p class="sub">${r.cat} · ${r.time}</p>
 <div class="box"><div class="scale"><button id="m" aria-label="Fewer servings">−</button><b>Serves ${serv}</b><button id="p" aria-label="More servings">+</button></div>
 <ul>${r.ing.map(i=>`<li class="i"><b>${fmt(i[0]*k)}${i[1]?' '+i[1]:''}</b> ${i[2]}</li>`).join('')}</ul></div>
 <div class="box"><h2>Method</h2><br><ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol>${r.note?`<p class="note">Tip: ${r.note}</p>`:''}</div>`;
 document.getElementById('m').onclick=()=>{if(serv>1){serv--;detail(r)}};
 document.getElementById('p').onclick=()=>{serv++;detail(r)};
 app.querySelectorAll('li.i').forEach(li=>li.onclick=()=>li.classList.toggle('done'));
}

function route(){
 const id=decodeURIComponent(location.hash.slice(1));
 const r=RECIPES.find(x=>x.id===id);
 window.scrollTo(0,0);
 r?detail(r):list();
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
